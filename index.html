<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<meta name="description" content="One glance for both of you. A private habit tracker for two people.">
<meta name="theme-color" content="#05060A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=3f074f4">
</head>
<body data-build="3f074f4">
<div id="wallpaper" aria-hidden="true">
  <div class="orb orb-you"></div>
  <div class="orb orb-partner"></div>
  <div class="orb orb-accent"></div>
</div>

<div id="offline-banner" class="hidden" role="status">You are offline. Logging is paused.</div>

<div id="statusbar-band" aria-hidden="true"></div>

<main id="app">
  <!-- Onboarding -->
  <section id="screen-onboarding" class="screen" aria-label="Setup"></section>

  <!-- App screens (content lands in later phases) -->
  <section id="screen-today" class="screen hidden" aria-label="Today">
    <div id="today-root"></div>
  </section>
  <section id="screen-pod" class="screen hidden" aria-label="Sync">
    <div id="pod-root"></div>
  </section>
  <section id="screen-habits" class="screen hidden" aria-label="Habits">
    <div id="manage-root"></div>
  </section>

  <nav id="tabbar" class="glass hidden" aria-label="Primary">
    <button class="tab active" data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="pod" aria-label="Sync">
      <svg viewBox="0 0 26 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="12" r="7"/><circle cx="17" cy="12" r="7"/></svg>
      <span>Sync</span>
    </button>
    <button class="tab" data-tab="habits" aria-label="Habits">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Habits</span>
    </button>
  </nav>
</main>

<div id="toast" class="glass hidden" role="status"></div>

<script src="js/util.js?v=3f074f4"></script>
<script src="js/api.js?v=3f074f4"></script>
<script src="js/colors.js?v=3f074f4"></script>
<script src="js/demo.js?v=3f074f4"></script>
<script src="js/store.js?v=3f074f4"></script>
<script src="js/data.js?v=3f074f4"></script>
<script src="js/today.js?v=3f074f4"></script>
<script src="js/pod.js?v=3f074f4"></script>
<script src="js/manage.js?v=3f074f4"></script>
<script src="js/onboarding.js?v=3f074f4"></script>
<script src="js/app.js?v=3f074f4"></script>
</body>
</html>
